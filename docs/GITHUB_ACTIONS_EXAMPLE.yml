# ==============================================================================
# Sample GitHub Actions Workflow: CI/CD Deployment with PulseOps Webhook Ping
# Save as: .github/workflows/deploy.yml
# ==============================================================================
name: Production Deployment Pipeline

on:
  push:
    branches:
      - main
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Record Deployment Start Time
        id: timer
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      # --- YOUR BUILD & DEPLOYMENT STEPS HERE ---
      - name: Run Build & Tests
        run: |
          echo "Building application container..."
          echo "Deploying to production cluster..."
          sleep 3

      # --- NOTIFY PULSEOPS PLATFORM ---
      - name: Ping PulseOps Deployment Webhook
        if: always() # Run on success, failure, or cancellation
        env:
          PULSEOPS_PROJECT_ID: "b0000000-0000-0000-0000-000000000001" # Your PulseOps Project UUID
          PULSEOPS_SECRET: ${{ secrets.PULSEOPS_WEBHOOK_SECRET }}       # Your project's HMAC secret
          PULSEOPS_HOST: "https://pulseops-backend.onrender.com"
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.timer.outputs.start_time }}))

          # Determine status
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="success"
          elif [ "${{ job.status }}" = "cancelled" ]; then
            STATUS="cancelled"
          else
            STATUS="failure"
          fi

          # Construct JSON Payload
          PAYLOAD=$(jq -n \
            --arg env "${{ github.ref_name == 'main' && 'production' || 'staging' }}" \
            --arg sha "${{ github.sha }}" \
            --arg msg "$(git log -1 --pretty=%B | head -n 1)" \
            --arg branch "${{ github.ref_name }}" \
            --arg author "${{ github.actor }}" \
            --arg status "$STATUS" \
            --arg duration "$DURATION" \
            --arg pipe_id "${{ github.run_id }}" \
            --arg pipe_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              environment: $env,
              commit_sha: $sha,
              commit_message: $msg,
              branch: $branch,
              author: $author,
              status: $status,
              duration_seconds: ($duration | tonumber),
              pipeline_id: $pipe_id,
              pipeline_url: $pipe_url
            }')

          # Compute HMAC-SHA256 signature using OpenSSL
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$PULSEOPS_SECRET" | sed 's/^.* //')

          echo "Dispatching webhook to PulseOps: status=$STATUS, duration=${DURATION}s"

          # POST to PulseOps Ingestion Engine
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${PULSEOPS_HOST}/api/v1/webhooks/github/${PULSEOPS_PROJECT_ID}" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -H "X-GitHub-Event: deployment" \
            -d "$PAYLOAD")

          echo "PulseOps Response HTTP Status: $HTTP_CODE"
          cat response.json
          echo ""

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning ::PulseOps deployment webhook rejected with status $HTTP_CODE"
          fi
